name: tests

on:
  push:
    branches: [master, 'v0.*']
  pull_request:
    branches: [master, 'v0.*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        rust: [stable, '1.88.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libdbus-1-dev
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +${{ matrix.rust }} fmt --all --check
      - name: Lint library and examples
        run: cargo +${{ matrix.rust }} clippy --locked --all-targets -- -D warnings
      - name: Test library and examples
        run: cargo +${{ matrix.rust }} test --locked --all-targets
      - name: Test documentation
        run: cargo +${{ matrix.rust }} test --locked --doc
      - name: Test UI request lifecycle
        run: node --test tests/ui.test.cjs tests/components.test.cjs
      - name: Build documentation
        run: cargo +${{ matrix.rust }} doc --locked --no-deps
      - name: Verify packaged consumer
        if: matrix.rust == 'stable'
        run: python scripts/check-package.py
