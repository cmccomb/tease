[package]
name = "tease"
version = "0.5.3"
edition = "2021"
rust-version = "1.88"
authors = ["Chris McComb <ccmcc2012@gmail.com>"]
description = "Build interactive desktop demos for Rust functions and machine-learning models"
readme = "README.md"
repository = "https://github.com/cmccomb/tease"
homepage = "https://cmccomb.com/tease/"
documentation = "https://docs.rs/tease"
license = "MIT OR Apache-2.0"
keywords = ["machine-learning", "ml", "ai", "smartcore", "gui"]
categories = ["algorithms", "mathematics", "gui"]
include = [
    "src/**", "examples/**", "tests/**", "scripts/check-package.py",
    "docs/migration-0.2.md", "docs/examples.md", "docs/guide.md", "docs/preview-response.png",
    "docs/preview-image.png", "docs/index.html", "docs/live/index.html", "docs/live/model.js",
    "docs/live/focus.css", "docs/live/focus.js",
    "docs/rustdoc-preview.md",
    "README.md", "CHANGELOG.md",
    "RELEASING.md", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml", "Cargo.lock",
]

[dependencies]
wry = "0.57.0"
tao = "0.37.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
csv = "1.3"
rfd = "0.15"

[dev-dependencies]
smartcore = { version = "=0.4.2", features = ["datasets"] }
automl = "=0.3.1"

# Build reference docs without requiring native GTK/WebKit libraries on docs.rs.
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []
